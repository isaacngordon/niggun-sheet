<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheet Builder - Canvas Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 300px;
            background: #2a2a2a;
            border-right: 1px solid #3a3a3a;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        
        .sidebar h2 {
            color: #f2cb05;
            margin-bottom: 20px;
        }
        
        .search-box {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #3a3a3a;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .songs-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .song-item {
            padding: 12px;
            background: #333;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
        }
        
        .song-item:hover {
            background: #444;
            transform: translateX(4px);
        }
        
        .song-item.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        
        .song-item.used {
            border-left: 3px solid #f2cb05;
            opacity: 0.7;
        }
        
        .song-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .song-artist {
            font-size: 12px;
            color: #999;
        }
        
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0a0a0a;
        }
        
        .toolbar {
            height: 60px;
            background: #2a2a2a;
            border-bottom: 1px solid #3a3a3a;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
        }
        
        .toolbar button {
            padding: 8px 16px;
            background: #f2cb05;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .toolbar button:hover {
            background: #e6b700;
            transform: translateY(-1px);
        }
        
        .toolbar .status {
            margin-left: auto;
            color: #999;
            font-size: 14px;
        }
        
        .alignment-controls {
            display: flex;
            gap: 2px;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .alignment-controls button {
            padding: 8px 12px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 0;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .alignment-controls button:hover {
            background: #444;
        }
        
        .alignment-controls button.active {
            background: #f2cb05;
            color: #000;
        }
        
        .column-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .column-controls label {
            color: #fff;
            font-size: 12px;
            margin-right: 5px;
        }
        
        .column-controls button {
            padding: 6px 10px;
            background: #333;
            color: #fff;
            border: 1px solid #3a3a3a;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s;
            min-width: 30px;
        }
        
        .column-controls button:hover {
            background: #444;
        }
        
        .column-controls button.active {
            background: #f2cb05;
            color: #000;
        }
        
        .test-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .test-controls label {
            color: #fff;
            font-size: 12px;
            margin-right: 5px;
        }
        
        .test-controls button {
            padding: 6px 8px;
            background: #2a4d3a;
            color: #fff;
            border: 1px solid #3a5a4a;
            border-radius: 3px;
            cursor: pointer;
            font-weight: 600;
            font-size: 11px;
            transition: all 0.2s;
        }
        
        .test-controls button:hover {
            background: #3a6d4a;
        }
        
        .canvas-container {
            flex: 1;
            overflow: auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
        }
        
        .page-wrapper {
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        .page-canvas {
            background: white;
            display: block;
            cursor: default;
        }
        
        .page-canvas.dragging {
            cursor: grabbing;
        }
        
        .page-canvas.drag-over {
            box-shadow: 0 0 20px rgba(242, 203, 5, 0.5);
        }
        
        .remove-btn {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            z-index: 10;
        }
        
        .remove-btn:hover {
            background: #ff6666;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #666;
        }
        
        .loading::after {
            content: 'Loading songs...';
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Song Library</h2>
        <input type="text" class="search-box" placeholder="Search songs..." id="searchBox">
        <div class="songs-list" id="songsList">
            <div class="loading"></div>
        </div>
    </div>
    
    <div class="main-area">
        <div class="toolbar">
            <button onclick="sheetBuilder.exportPDF()">Export PDF</button>
            <button onclick="sheetBuilder.clearAll()">Clear All</button>
            <button onclick="sheetBuilder.toggleTitles()" id="toggleTitlesBtn">Hide Titles</button>
            <button onclick="sheetBuilder.togglePageNumbers()" id="togglePageNumbersBtn">Hide Page Numbers</button>
            <div class="alignment-controls">
                <button onclick="sheetBuilder.setAlignment('center')" id="alignCenterBtn" class="active">Center</button>
                <button onclick="sheetBuilder.setAlignment('right')" id="alignRightBtn">Right</button>
            </div>
            <div class="column-controls">
                <label>Max Columns:</label>
                <button onclick="sheetBuilder.setMaxColumns(1)" id="col1Btn">1</button>
                <button onclick="sheetBuilder.setMaxColumns(2)" id="col2Btn">2</button>
                <button onclick="sheetBuilder.setMaxColumns(3)" id="col3Btn" class="active">3</button>
            </div>
            <div class="test-controls">
                <label>Test Layout:</label>
                <button onclick="sheetBuilder.addRandomSongs(5)">+5 Songs</button>
                <button onclick="sheetBuilder.addRandomSongs(10)">+10 Songs</button>
                <button onclick="sheetBuilder.addRandomSongs(15)">+15 Songs</button>
                <button onclick="sheetBuilder.addRandomSongs(20)">+20 Songs</button>
            </div>
            <div class="status" id="status">Drag songs to the sheet or double-click to add</div>
        </div>
        <div class="canvas-container" id="canvasContainer"></div>
    </div>
    
    <script>
        class SheetBuilder {
            constructor() {
                // Constants for page and text sizing
                this.PAGE_WIDTH = 612; // 8.5 inches at 72 DPI
                this.PAGE_HEIGHT = 792; // 11 inches at 72 DPI
                this.MARGIN_TOP = 80; // Increased from 50px to 80px
                this.MARGIN_LEFT = 50;
                this.MARGIN_RIGHT = 50;
                this.MARGIN_BOTTOM = 120; // Increased to avoid footer area
                this.USABLE_WIDTH = this.PAGE_WIDTH - (this.MARGIN_LEFT + this.MARGIN_RIGHT);
                this.USABLE_HEIGHT = this.PAGE_HEIGHT - (this.MARGIN_TOP + this.MARGIN_BOTTOM);
                this.COLUMN_GAP = 30;
                this.SONG_SPACING = 20;
                
                // State
                this.songs = [];
                this.pages = [];
                this.draggedSong = null;
                this.hoveredSong = null;
                this.selectedSong = null;
                this.dragState = null; // For internal song repositioning
                this.showTitles = true; // Toggle for showing/hiding titles
                this.lastGlobalReflowTime = 0; // Prevent rapid successive globalReflow calls
                this.showPageNumbers = true; // Toggle for showing/hiding page numbers
                this.textAlignment = 'center'; // Text alignment: 'center', 'right' (removed 'left')
                this.maxColumns = 3; // Maximum columns allowed (1, 2, or 3)
                
                // Final spacing values (no more debug sliders)
                this.spacingWithTitles = 15; // Song spacing when titles are shown
                this.spacingWithoutTitles = 15; // Song spacing when titles are hidden
                this.titleGap = 5; // Gap between title and lyrics (increased from 0px to 5px)
                this.titleSizeMultiplier = 0.89; // Title size as 89% of base font
                
                // Initialize
                this.init();
            }
            
            async init() {
                await this.loadSongs();
                this.createFirstPage();
                this.loadSelectedSongs(); // Load songs from localStorage
                this.setupEventListeners();
                this.render();
            }
            
            async loadSongs() {
                try {
                    // Load songs from API
                    const response = await fetch('/api/songs');
                    if (!response.ok) throw new Error('Failed to load songs');
                    this.songs = await response.json();
                } catch (error) {
                    console.error('Error loading songs:', error);
                    // Fallback to demo songs
                    this.songs = [
                        { title: "אדיר הוא", artist: "Traditional", lyrics: "אדיר הוא, יבנה ביתו בקרוב\nבמהרה בימינו בקרוב\nא-ל בנה, א-ל בנה\nבנה ביתך בקרוב" },
                        { title: "עוד ישמע", artist: "Traditional", lyrics: "עוד ישמע בערי יהודה\nובחוצות ירושלים\nקול ששון וקול שמחה\nקול חתן וקול כלה" },
                        { title: "ושמחת", artist: "Traditional", lyrics: "ושמחת בחגך\nוהיית אך שמח\nושמחת בחגך\nוהיית אך שמח" }
                    ];
                }
                this.renderSongsList();
            }
            
            loadSelectedSongs() {
                // Load selected songs from localStorage (from songs.html)
                const sheetSongs = JSON.parse(localStorage.getItem("sheetSongs")) || [];
                
                // Add each selected song to the sheet (skip sync to avoid loops)
                sheetSongs.forEach(song => {
                    // Find the song in our songs list to get complete data
                    const fullSong = this.songs.find(s => s.title === song.title && s.artist === song.artist);
                    if (fullSong) {
                        this.addSongToPage(fullSong, this.pages[0], null, null, true); // skipSync = true
                    } else {
                        // Fallback: use the song data from localStorage directly
                        this.addSongToPage(song, this.pages[0], null, null, true); // skipSync = true
                    }
                });
                
                // Update song list to reflect loaded songs
                this.renderSongsList();
                
                if (sheetSongs.length > 0) {
                    this.updateStatus(`Loaded ${sheetSongs.length} songs from your selection`);
                }
            }
            
            syncToLocalStorage() {
                // Collect all songs from all pages
                const allSongs = [];
                this.pages.forEach(page => {
                    allSongs.push(...page.songs);
                });
                
                // Convert to the format expected by songs.html
                const sheetSongs = allSongs.map(song => ({
                    title: song.title,
                    artist: song.artist,
                    lyrics: song.lyrics
                }));
                
                // Update localStorage
                localStorage.setItem("sheetSongs", JSON.stringify(sheetSongs));
            }
            
            renderSongsList() {
                const container = document.getElementById('songsList');
                container.innerHTML = '';
                
                // Get list of songs currently on the sheet
                const songsOnSheet = new Set();
                this.pages.forEach(page => {
                    page.songs.forEach(song => {
                        songsOnSheet.add(`${song.title}|${song.artist}`);
                    });
                });
                
                this.songs.forEach((song, index) => {
                    const div = document.createElement('div');
                    div.className = 'song-item';
                    
                    // Check if this song is on the sheet and add 'used' class
                    const songKey = `${song.title}|${song.artist}`;
                    if (songsOnSheet.has(songKey)) {
                        div.classList.add('used');
                    }
                    
                    div.draggable = true;
                    div.dataset.songIndex = index;
                    div.innerHTML = `
                        <div class="song-title">${song.title}</div>
                        <div class="song-artist">${song.artist || 'Unknown'}</div>
                    `;
                    
                    // Drag events
                    div.addEventListener('dragstart', (e) => {
                        this.draggedSong = song;
                        div.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'copy';
                    });
                    
                    div.addEventListener('dragend', () => {
                        div.classList.remove('dragging');
                        this.draggedSong = null;
                    });
                    
                    // Double click to add
                    div.addEventListener('dblclick', () => {
                        this.addSongToSheet(song);
                    });
                    
                    container.appendChild(div);
                });
            }
            
            createFirstPage() {
                this.addNewPage();
            }
            
            addNewPage() {
                const pageIndex = this.pages.length;
                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';
                
                const canvas = document.createElement('canvas');
                canvas.className = 'page-canvas';
                
                // High-DPI canvas setup
                const dpr = window.devicePixelRatio || 1;
                const displayWidth = this.PAGE_WIDTH;
                const displayHeight = this.PAGE_HEIGHT;
                
                // Set actual canvas size in memory (scaled up for high DPI)
                canvas.width = displayWidth * dpr;
                canvas.height = displayHeight * dpr;
                
                // Set display size (CSS pixels)
                canvas.style.width = displayWidth + 'px';
                canvas.style.height = displayHeight + 'px';
                
                canvas.dataset.pageIndex = pageIndex;
                
                // Get context and scale for high DPI
                const ctx = canvas.getContext('2d');
                ctx.scale(dpr, dpr);
                
                // Enable high-quality text rendering
                ctx.textRenderingOptimization = 'optimizeQuality';
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                
                wrapper.appendChild(canvas);
                document.getElementById('canvasContainer').appendChild(wrapper);
                
                // Inherit configuration from first page if it exists
                let columns = 1;
                let fontSize = 18;
                if (this.pages.length > 0 && this.pages[0].columns && this.pages[0].fontSize) {
                    columns = this.pages[0].columns;
                    fontSize = this.pages[0].fontSize;
                }
                
                const page = {
                    canvas: canvas,
                    ctx: ctx,
                    wrapper: wrapper,
                    dpr: dpr, // Store DPR for later use
                    songs: [],
                    columns: columns,
                    fontSize: fontSize,
                    columnHeights: new Array(columns).fill(0)
                };
                
                this.pages.push(page);
                this.setupCanvasEvents(canvas, page);
                
                return page;
            }
            
            setupCanvasEvents(canvas, page) {
                // Drag over
                canvas.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (this.draggedSong) {
                        canvas.classList.add('drag-over');
                    }
                });
                
                // Drag leave
                canvas.addEventListener('dragleave', () => {
                    canvas.classList.remove('drag-over');
                });
                
                // Drop
                canvas.addEventListener('drop', (e) => {
                    e.preventDefault();
                    canvas.classList.remove('drag-over');
                    
                    if (this.draggedSong) {
                        const rect = canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) * (this.PAGE_WIDTH / rect.width);
                        const y = (e.clientY - rect.top) * (this.PAGE_HEIGHT / rect.height);
                        this.addSongToPage(this.draggedSong, page, x, y);
                    }
                });
                
                // Click to select
                canvas.addEventListener('click', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (this.PAGE_WIDTH / rect.width);
                    const y = (e.clientY - rect.top) * (this.PAGE_HEIGHT / rect.height);
                    this.handleCanvasClick(page, x, y);
                });
                
                // Mouse down to start drag
                canvas.addEventListener('mousedown', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (this.PAGE_WIDTH / rect.width);
                    const y = (e.clientY - rect.top) * (this.PAGE_HEIGHT / rect.height);
                    this.handleMouseDown(page, x, y, e);
                });
                
                // Mouse move for hover and drag
                canvas.addEventListener('mousemove', (e) => {
                    const rect = canvas.getBoundingClientRect();
                    const x = (e.clientX - rect.left) * (this.PAGE_WIDTH / rect.width);
                    const y = (e.clientY - rect.top) * (this.PAGE_HEIGHT / rect.height);
                    
                    if (this.dragState && !this.globalMouseMoveHandler) {
                        // Only handle if global listeners aren't active
                        this.handleMouseDrag(x, y);
                    } else if (!this.dragState) {
                        this.handleCanvasHover(page, x, y);
                    }
                });
                
                // Mouse up to end drag
                canvas.addEventListener('mouseup', (e) => {
                    if (this.dragState && !this.globalMouseUpHandler) {
                        // Only handle if global listeners aren't active
                        const rect = canvas.getBoundingClientRect();
                        const x = (e.clientX - rect.left) * (this.PAGE_WIDTH / rect.width);
                        const y = (e.clientY - rect.top) * (this.PAGE_HEIGHT / rect.height);
                        this.handleMouseUp(x, y);
                    }
                });
            }
            
            addSongToSheet(song) {
                // Check for duplicates
                const isDuplicate = this.pages.some(page => 
                    page.songs.some(existingSong => 
                        existingSong.title === song.title && existingSong.artist === song.artist
                    )
                );
                
                if (isDuplicate) {
                    this.updateStatus(`"${song.title}" is already on the sheet`);
                    return;
                }
                
                // If we have pages, prioritize the first page
                if (this.pages.length > 0) {
                    const firstPage = this.pages[0];
                    
                    // First try to add to first page
                    this.addSongToPage(song, firstPage);
                    
                    // If first page optimization creates overflow, it will be handled automatically
                    return;
                }
                
                // If no pages exist, create the first page
                const newPage = this.addNewPage();
                this.addSongToPage(song, newPage);
            }
            
            handleMouseDown(page, x, y, event) {
                // Find song at this position
                const song = this.findSongAt(page, x, y);
                if (song) {
                    this.dragState = {
                        song: song,
                        page: page,
                        originalPage: page,
                        startX: x,
                        startY: y,
                        offset: {
                            x: x - song.x,
                            y: y - song.y
                        },
                        previewPosition: null,
                        isDragging: false,
                        targetPage: page
                    };
                    
                    // Add dragging class for cursor
                    page.canvas.classList.add('dragging');
                    
                    // Set up global mouse tracking for cross-page dragging
                    this.setupGlobalDragListeners();
                    
                    event.preventDefault();
                }
            }
            
            setupGlobalDragListeners() {
                // Global mouse move listener for cross-page dragging
                this.globalMouseMoveHandler = (e) => {
                    if (!this.dragState) return;
                    
                    // Find which page canvas the mouse is over
                    const targetElement = document.elementFromPoint(e.clientX, e.clientY);
                    let targetPage = null;
                    let x = 0, y = 0;
                    
                    // Check if we're over a page canvas
                    for (let page of this.pages) {
                        if (targetElement === page.canvas || page.canvas.contains(targetElement)) {
                            targetPage = page;
                            const rect = page.canvas.getBoundingClientRect();
                            x = (e.clientX - rect.left) * (this.PAGE_WIDTH / rect.width);
                            y = (e.clientY - rect.top) * (this.PAGE_HEIGHT / rect.height);
                            break;
                        }
                    }
                    
                    if (targetPage) {
                        this.dragState.targetPage = targetPage;
                        this.handleMouseDragGlobal(targetPage, x, y);
                    }
                };
                
                // Global mouse up listener
                this.globalMouseUpHandler = (e) => {
                    if (!this.dragState) return;
                    
                    // Find which page canvas the mouse is over
                    const targetElement = document.elementFromPoint(e.clientX, e.clientY);
                    let targetPage = null;
                    let x = 0, y = 0;
                    
                    // Check if we're over a page canvas
                    for (let page of this.pages) {
                        if (targetElement === page.canvas || page.canvas.contains(targetElement)) {
                            targetPage = page;
                            const rect = page.canvas.getBoundingClientRect();
                            x = (e.clientX - rect.left) * (this.PAGE_WIDTH / rect.width);
                            y = (e.clientY - rect.top) * (this.PAGE_HEIGHT / rect.height);
                            break;
                        }
                    }
                    
                    if (targetPage) {
                        this.handleMouseUpGlobal(targetPage, x, y);
                    } else {
                        // Dropped outside any page - cancel drag
                        this.cancelDrag();
                    }
                };
                
                document.addEventListener('mousemove', this.globalMouseMoveHandler);
                document.addEventListener('mouseup', this.globalMouseUpHandler);
            }
            
            removeGlobalDragListeners() {
                if (this.globalMouseMoveHandler) {
                    document.removeEventListener('mousemove', this.globalMouseMoveHandler);
                    this.globalMouseMoveHandler = null;
                }
                if (this.globalMouseUpHandler) {
                    document.removeEventListener('mouseup', this.globalMouseUpHandler);
                    this.globalMouseUpHandler = null;
                }
            }
            
            handleMouseDragGlobal(targetPage, x, y) {
                if (!this.dragState) return;
                
                // Check if we've moved enough to consider this a drag (not just a click)
                const originalPage = this.dragState.originalPage;
                const moved = Math.abs(x - this.dragState.startX) > 5 || 
                             Math.abs(y - this.dragState.startY) > 5 ||
                             targetPage !== originalPage; // Cross-page movement is always considered a drag
                
                if (moved) {
                    this.dragState.isDragging = true;
                    
                    // Calculate where the song would be inserted if dropped here
                    const insertPosition = this.findInsertPosition(targetPage, x, y, this.dragState.song);
                    
                    // Calculate preview position for visual feedback
                    this.dragState.previewPosition = this.calculatePreviewPosition(targetPage, insertPosition, x, y);
                    this.dragState.targetPage = targetPage;
                }
                
                // Re-render to show preview
                this.render();
            }
            
            handleMouseUpGlobal(targetPage, x, y) {
                if (!this.dragState) return;
                
                const { song, originalPage } = this.dragState;
                
                // Remove dragging class
                originalPage.canvas.classList.remove('dragging');
                
                // Check if we actually moved (avoid triggering on simple clicks)
                const moved = Math.abs(x - this.dragState.startX) > 5 || 
                             Math.abs(y - this.dragState.startY) > 5 ||
                             targetPage !== originalPage;
                
                if (moved) {
                    // Find new position BEFORE removing the song (so bounds are still available)
                    const insertPosition = this.findInsertPosition(targetPage, x, y, song);
                    
                    // Remove song from original page
                    const songIndex = originalPage.songs.indexOf(song);
                    if (songIndex > -1) {
                        originalPage.songs.splice(songIndex, 1);
                    }
                    
                    // Add song to target page
                    if (targetPage !== originalPage) {
                        // Cross-page move - add to target page
                        targetPage.songs.splice(insertPosition.index, 0, song);
                        song.preferredColumn = insertPosition.column;
                    } else {
                        // Same page move - adjust insert index if needed
                        let adjustedIndex = insertPosition.index;
                        if (songIndex < insertPosition.index) {
                            adjustedIndex--;
                        }
                        originalPage.songs.splice(adjustedIndex, 0, song);
                        song.preferredColumn = insertPosition.column;
                    }
                    
                    // Clear dragging state COMPLETELY before any redistribution
                    const wasDragging = this.dragState.isDragging;
                    this.dragState.isDragging = false;
                    this.dragState.previewPosition = null;
                    this.dragState.song = null; // Clear song reference to prevent render conflicts
                    
                    // Redistribute songs on both pages if different
                    if (targetPage !== originalPage) {
                        const originalPageIndex = this.pages.indexOf(originalPage);
                        const targetPageIndex = this.pages.indexOf(targetPage);
                        
                        // Use backflow logic when moving FROM earlier page TO later page
                        if (originalPageIndex < targetPageIndex) {
                            // First redistribute both pages
                            this.redistributeSongs(originalPage);
                            this.redistributeSongs(targetPage);
                            
                            // Only do backflow if the original page has very few songs (obvious gap)
                            if (originalPage.songs.length <= 2) {
                                this.controlledBackflow(originalPageIndex);
                                this.render();
                            }
                        } else {
                            // Moving backward - just redistribute both pages normally
                            this.redistributeSongs(originalPage);
                            this.redistributeSongs(targetPage);
                        }
                        
                        this.updateStatus(`Moved "${song.title}" to page ${targetPageIndex + 1}`);
                    } else {
                        this.redistributeSongs(originalPage);
                        this.updateStatus(`Moved "${song.title}"`);
                    }
                    
                    this.syncToLocalStorage();
                    this.render();
                } else {
                    // Clear dragging state before rendering 
                    if (this.dragState) {
                        this.dragState.isDragging = false;
                        this.dragState.previewPosition = null;
                    }
                    
                    // Just re-render to reset position if no real movement
                    this.redistributeSongs(originalPage);
                    this.render();
                }
                
                // Clean up global listeners
                this.removeGlobalDragListeners();
                this.dragState = null;
            }
            
            cancelDrag() {
                if (!this.dragState) return;
                
                // Remove dragging class
                this.dragState.originalPage.canvas.classList.remove('dragging');
                
                // Clear dragging state
                this.dragState.isDragging = false;
                this.dragState.previewPosition = null;
                
                // Re-render to reset position
                this.redistributeSongs(this.dragState.originalPage);
                this.render();
                
                // Clean up global listeners
                this.removeGlobalDragListeners();
                this.dragState = null;
            }
            
            handleMouseDrag(x, y) {
                if (!this.dragState) return;
                
                // Check if we've moved enough to consider this a drag (not just a click)
                const moved = Math.abs(x - this.dragState.startX) > 5 || Math.abs(y - this.dragState.startY) > 5;
                
                if (moved) {
                    this.dragState.isDragging = true;
                    
                    // Calculate where the song would be inserted if dropped here
                    const insertPosition = this.findInsertPosition(this.dragState.page, x, y, this.dragState.song);
                    
                    // Calculate preview position for visual feedback
                    this.dragState.previewPosition = this.calculatePreviewPosition(this.dragState.page, insertPosition, x, y);
                }
                
                // Re-render to show preview
                this.render();
            }
            
            handleMouseUp(x, y) {
                if (!this.dragState) return;
                
                const { song, page } = this.dragState;
                
                // Remove dragging class
                page.canvas.classList.remove('dragging');
                
                // Check if we actually moved (avoid triggering on simple clicks)
                const moved = Math.abs(x - this.dragState.startX) > 5 || Math.abs(y - this.dragState.startY) > 5;
                
                if (moved) {
                    // Find new position BEFORE removing the song (so bounds are still available)
                    const insertPosition = this.findInsertPosition(page, x, y, song);
                    
                    // Remove song from current position
                    const songIndex = page.songs.indexOf(song);
                    if (songIndex > -1) {
                        page.songs.splice(songIndex, 1);
                    }
                    
                    // Adjust insert index if needed (if we removed a song before the insertion point)
                    let adjustedIndex = insertPosition.index;
                    if (songIndex < insertPosition.index) {
                        adjustedIndex--;
                    }
                    
                    // Re-insert at new position
                    page.songs.splice(adjustedIndex, 0, song);
                    song.preferredColumn = insertPosition.column;
                    
                    // Clear dragging state before rendering so song becomes visible
                    this.dragState.isDragging = false;
                    this.dragState.previewPosition = null;
                    
                    // Just redistribute songs without changing the page configuration
                    this.redistributeSongs(page);
                    this.syncToLocalStorage();
                    this.render();
                    this.updateStatus(`Moved "${song.title}"`);
                } else {
                    // Clear dragging state before rendering 
                    if (this.dragState) {
                        this.dragState.isDragging = false;
                        this.dragState.previewPosition = null;
                    }
                    
                    // Just re-render to reset position if no real movement
                    this.redistributeSongs(page);
                    this.render();
                }
                
                this.dragState = null;
            }
            
            handleCanvasHover(page, x, y) {
                // Check if cursor is over a song
                const song = this.findSongAt(page, x, y);
                if (song) {
                    page.canvas.style.cursor = 'grab';
                } else {
                    page.canvas.style.cursor = 'default';
                }
            }
            
            findSongAt(page, x, y) {
                // Check each song's bounds
                for (let song of page.songs) {
                    if (song.bounds && 
                        x >= song.bounds.x && x <= song.bounds.x + song.bounds.width &&
                        y >= song.bounds.y && y <= song.bounds.y + song.bounds.height) {
                        return song;
                    }
                }
                return null;
            }
            
            canFitSong(page, song) {
                // Estimate song height
                const estimatedHeight = this.estimateSongHeight(song, page.fontSize);
                const minColumnHeight = Math.min(...page.columnHeights);
                return minColumnHeight + estimatedHeight < this.USABLE_HEIGHT;
            }
            
            estimateSongHeight(song, fontSize) {
                const lines = song.lyrics.split('\n');
                const lineHeight = fontSize * 1.4;
                let totalHeight = 0;
                
                // Add spacing between songs (15px for both modes)
                const songSpacing = this.showTitles ? this.spacingWithTitles : this.spacingWithoutTitles;
                totalHeight += songSpacing;
                
                // Add height for title if showing titles
                if (this.showTitles) {
                    const titleHeight = fontSize * this.titleSizeMultiplier * 1.4; // 89% of base font
                    totalHeight += titleHeight + this.titleGap; // Title height + 5px gap
                }
                
                // Count only original lines (no word wrapping)
                const nonEmptyLines = lines.filter(line => line.trim()).length;
                const emptyLines = lines.length - nonEmptyLines;
                
                totalHeight += nonEmptyLines * lineHeight; // Content lines
                totalHeight += emptyLines * lineHeight; // Empty lines
                
                return totalHeight;
            }
            
            addSongToPage(song, page, dropX = null, dropY = null, skipSync = false) {
                // Add song data first (without positioning)
                const songData = {
                    ...song,
                    width: 0, // Will be set during optimization
                    height: 0, // Will be calculated during render
                };
                
                // If specific position provided, insert at that position
                if (dropX !== null && dropY !== null) {
                    const insertPosition = this.findInsertPosition(page, dropX, dropY);
                    page.songs.splice(insertPosition.index, 0, songData);
                    songData.preferredColumn = insertPosition.column;
                } else {
                    page.songs.push(songData);
                }
                
                // Now optimize the layout to find the best configuration
                this.optimizePageLayout(page);
                
                // Sync with localStorage (unless loading from localStorage)
                if (!skipSync) {
                    this.syncToLocalStorage();
                }
                
                // Update song list to reflect changes
                this.renderSongsList();
                
                this.render();
                this.updateStatus(`Added "${song.title}" to page ${this.pages.indexOf(page) + 1}`);
            }
            
            findInsertPosition(page, dropX, dropY, draggedSong = null) {
                // Determine which column the drop position is in
                const columnWidth = this.getColumnWidth(page.columns);
                let targetColumn = Math.floor((dropX - this.MARGIN_LEFT) / (columnWidth + this.COLUMN_GAP));
                targetColumn = Math.max(0, Math.min(targetColumn, page.columns - 1));
                
                // Get all songs that are currently in the target column (by their actual rendered position)
                // Exclude the dragged song from consideration
                const songsInColumn = [];
                for (let i = 0; i < page.songs.length; i++) {
                    const song = page.songs[i];
                    if (song === draggedSong) continue; // Skip the dragged song
                    
                    if (song.bounds) {
                        const songColumn = Math.floor((song.bounds.x - this.MARGIN_LEFT) / (columnWidth + this.COLUMN_GAP));
                        if (songColumn === targetColumn) {
                            songsInColumn.push({ song, index: i, y: song.bounds.y });
                        }
                    }
                }
                
                // Sort songs by their Y position
                songsInColumn.sort((a, b) => a.y - b.y);
                
                // Find where to insert based on Y position
                let insertIndex = 0;
                
                if (songsInColumn.length === 0) {
                    // Empty column - need to find where this column should start
                    // Find the first song that should come after this column position
                    for (let i = 0; i < page.songs.length; i++) {
                        const song = page.songs[i];
                        if (song === draggedSong) continue;
                        
                        if (song.bounds) {
                            const songColumn = Math.floor((song.bounds.x - this.MARGIN_LEFT) / (columnWidth + this.COLUMN_GAP));
                            if (songColumn > targetColumn) {
                                insertIndex = i;
                                break;
                            }
                        }
                    }
                    // If no songs found in later columns, insert at end
                    if (insertIndex === 0) {
                        insertIndex = page.songs.length;
                    }
                } else {
                    // Find the right position between songs
                    let inserted = false;
                    for (let i = 0; i < songsInColumn.length; i++) {
                        const currentSong = songsInColumn[i];
                        const songMiddleY = currentSong.y + (currentSong.song.bounds.height / 2);
                        
                        if (dropY < songMiddleY) {
                            // Insert before this song
                            insertIndex = currentSong.index;
                            inserted = true;
                            break;
                        }
                    }
                    
                    if (!inserted) {
                        // Insert after the last song in the column
                        const lastSong = songsInColumn[songsInColumn.length - 1];
                        insertIndex = lastSong.index + 1;
                    }
                }
                
                return { index: insertIndex, column: targetColumn };
            }
            
            getShortestColumnIndex(page) {
                let minHeight = page.columnHeights[0];
                let minIndex = 0;
                
                for (let i = 1; i < page.columnHeights.length; i++) {
                    if (page.columnHeights[i] < minHeight) {
                        minHeight = page.columnHeights[i];
                        minIndex = i;
                    }
                }
                
                return minIndex;
            }
            
            getColumnWidth(columns) {
                return (this.USABLE_WIDTH - ((columns - 1) * this.COLUMN_GAP)) / columns;
            }
            
            optimizePageLayout(page) {
                const pageIndex = this.pages.indexOf(page);
                const isFirstPage = pageIndex === 0;
                
                // For subsequent pages, always use the same configuration as the first page
                if (!isFirstPage && this.pages[0].columns && this.pages[0].fontSize) {
                    page.columns = this.pages[0].columns;
                    page.fontSize = this.pages[0].fontSize;
                    page.columnHeights = new Array(this.pages[0].columns).fill(0);
                    this.redistributeSongs(page);
                    return;
                }
                
                // For first page, try different column counts and font sizes
                const allConfigurations = [
                    { columns: 1, fontSize: 24 },
                    { columns: 1, fontSize: 20 },
                    { columns: 1, fontSize: 18 },
                    { columns: 2, fontSize: 18 },
                    { columns: 2, fontSize: 16 },
                    { columns: 2, fontSize: 14 },
                    { columns: 3, fontSize: 14 },
                    { columns: 3, fontSize: 12 },
                    { columns: 3, fontSize: 10 }
                ];
                
                // Filter configurations based on maxColumns setting
                let configurations = allConfigurations.filter(config => config.columns <= this.maxColumns);
                
                // Always try to use the maximum columns first, then fall back if needed
                // Sort by columns descending (highest first), then by fontSize descending for same column count
                configurations = configurations.sort((a, b) => {
                    if (a.columns !== b.columns) {
                        return b.columns - a.columns; // Higher columns first
                    }
                    return b.fontSize - a.fontSize; // Higher fontSize first for same column count
                });
                
                let bestConfig = null;
                
                for (let config of configurations) {
                    if (this.testConfiguration(page, config)) {
                        bestConfig = config;
                        break; // Take the first (highest column count) that works
                    }
                }
                
                if (bestConfig) {
                    page.columns = bestConfig.columns;
                    page.fontSize = bestConfig.fontSize;
                    page.columnHeights = new Array(bestConfig.columns).fill(0);
                    this.redistributeSongs(page);
                    return;
                }
                
                // If nothing fits, we need overflow handling
                this.handleOverflow(page);
            }
            
            testConfiguration(page, config) {
                const columnWidth = this.getColumnWidth(config.columns);
                const testHeights = new Array(config.columns).fill(0);
                
                let currentColumn = 0;
                
                for (let song of page.songs) {
                    const height = this.estimateSongHeight(song, config.fontSize);
                    
                    // Check if this configuration causes unnatural line breaks
                    const naturalBreaksOk = this.checkNaturalLineBreaks(song, config.fontSize, columnWidth);
                    if (!naturalBreaksOk) {
                        return false; // Reject if it causes unnatural breaks
                    }
                    
                    // Use flow logic: try current column, then move to next if full
                    let placed = false;
                    while (currentColumn < config.columns && !placed) {
                        // Add spacing if not first song in column (same logic as redistributeSongs)
                        const spacing = testHeights[currentColumn] === 0 ? 0 : 
                                      (this.showTitles ? this.spacingWithTitles : this.spacingWithoutTitles);
                        
                        const totalHeight = testHeights[currentColumn] + spacing + height;
                        
                        if (totalHeight <= this.USABLE_HEIGHT) {
                            testHeights[currentColumn] += spacing + height;
                            placed = true;
                        } else {
                            currentColumn++;
                        }
                    }
                    
                    // If couldn't place in any column, configuration doesn't work
                    if (!placed) {
                        return false;
                    }
                }
                
                return true;
            }
            
            checkNaturalLineBreaks(song, fontSize, columnWidth) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                // Use high-DPI for accurate text measurements
                const dpr = window.devicePixelRatio || 1;
                ctx.scale(dpr, dpr);
                ctx.font = `${fontSize}px Arial`;
                
                const lines = song.lyrics.split('\n');
                let longLinesCount = 0;
                
                for (let line of lines) {
                    if (!line.trim()) continue;
                    
                    // Check if the entire line fits without any breaking
                    const lineMetrics = ctx.measureText(line.trim());
                    if (lineMetrics.width > columnWidth) {
                        longLinesCount++;
                    }
                }
                
                // Be more lenient for narrower columns - allow some text wrapping
                // Only reject if more than 30% of lines would need wrapping
                const maxAllowedLongLines = Math.ceil(lines.filter(l => l.trim()).length * 0.3);
                return longLinesCount <= maxAllowedLongLines;
            }
            
            redistributeSongs(page) {
                const columnWidth = this.getColumnWidth(page.columns);
                page.columnHeights = new Array(page.columns).fill(0);
                
                const songsToPlace = [...page.songs];
                const placedSongs = [];
                const overflowSongs = [];
                
                let currentColumn = 0;
                
                for (let song of songsToPlace) {
                    const height = this.estimateSongHeight(song, page.fontSize);
                    let placed = false;
                    
                    // Try to place in current column
                    while (currentColumn < page.columns && !placed) {
                        // Add spacing if not first song in column
                        const spacing = page.columnHeights[currentColumn] === 0 ? 0 : 
                                      (this.showTitles ? this.spacingWithTitles : this.spacingWithoutTitles);
                        
                        const totalHeight = page.columnHeights[currentColumn] + spacing + height;
                        
                        // If it fits in current column, place it
                        if (totalHeight <= this.USABLE_HEIGHT) {
                            page.columnHeights[currentColumn] += spacing;
                            
                            song.x = this.MARGIN_LEFT + (currentColumn * (columnWidth + this.COLUMN_GAP));
                            song.y = this.MARGIN_TOP + page.columnHeights[currentColumn];
                            song.width = columnWidth;
                            song.columnIndex = currentColumn;
                            song.height = height;
                            song.preferredColumn = currentColumn;
                            
                            page.columnHeights[currentColumn] += height;
                            
                            // Set bounds for drag detection
                            song.bounds = {
                                x: song.x,
                                y: song.y - page.fontSize,
                                width: song.width,
                                height: song.height
                            };
                            
                            placedSongs.push(song);
                            placed = true;
                        } else {
                            // Column is full, move to next column
                            currentColumn++;
                        }
                    }
                    
                    // If we couldn't place it in any column, it overflows to next page
                    if (!placed) {
                        overflowSongs.push(song);
                    }
                }
                
                // Update page with placed songs
                page.songs = placedSongs;
                
                // Handle overflow to next page
                if (overflowSongs.length > 0) {
                    this.handleOverflowToNextPage(page, overflowSongs);
                }
            }
            
            globalReflow(startPageIndex) {
                // Prevent rapid successive calls that can cause chaos during dragging
                const now = Date.now();
                if (now - this.lastGlobalReflowTime < 500) { // 500ms cooldown
                    // Instead of global reflow, just redistribute affected pages normally
                    for (let i = startPageIndex; i < this.pages.length; i++) {
                        this.redistributeSongs(this.pages[i]);
                    }
                    return;
                }
                this.lastGlobalReflowTime = now;
                
                // Starting from the affected page, redistribute all songs across all pages
                // This creates backflow effect where songs from later pages fill gaps in earlier pages
                
                // Collect all songs from startPage onwards
                const allSongsFromStart = [];
                for (let i = startPageIndex; i < this.pages.length; i++) {
                    allSongsFromStart.push(...this.pages[i].songs);
                    this.pages[i].songs = []; // Clear the page
                }
                
                // Redistribute all collected songs starting from the start page
                let currentPageIndex = startPageIndex;
                let songIndex = 0;
                
                while (songIndex < allSongsFromStart.length) {
                    const currentPage = this.pages[currentPageIndex];
                    const song = allSongsFromStart[songIndex];
                    
                    // Try to add song to current page
                    currentPage.songs.push(song);
                    this.redistributeSongs(currentPage);
                    
                    // Check if song was placed (not overflowed)
                    if (currentPage.songs.includes(song)) {
                        songIndex++; // Song was placed, move to next song
                    } else {
                        // Song was overflowed, remove it and try next page
                        currentPage.songs.pop();
                        currentPageIndex++;
                        
                        // Create new page if needed
                        if (currentPageIndex >= this.pages.length) {
                            this.addNewPage();
                        }
                    }
                }
                
                // Clean up any empty pages at the end
                this.removeEmptyTrailingPages();
            }
            
            removeEmptyTrailingPages() {
                // Remove empty pages from the end (but keep at least one page)
                while (this.pages.length > 1 && this.pages[this.pages.length - 1].songs.length === 0) {
                    const lastPage = this.pages.pop();
                    lastPage.wrapper.remove(); // Remove from DOM
                }
            }
            
            getPageCapacity(page) {
                // Estimate how many songs can fit on a page based on current configuration
                const avgSongHeight = 60; // Conservative estimate
                const availableHeight = this.USABLE_HEIGHT;
                const songsPerColumn = Math.floor(availableHeight / avgSongHeight);
                return songsPerColumn * page.columns;
            }
            
            controlledBackflow(startPageIndex) {
                // Conservative backflow that only moves one song at a time to prevent chaos
                let changesMade = false;
                
                // Only try to move ONE song from the immediate next page
                if (startPageIndex + 1 < this.pages.length) {
                    const currentPage = this.pages[startPageIndex];
                    const nextPage = this.pages[startPageIndex + 1];
                    
                    if (nextPage.songs.length > 0) {
                        // Try only the first song from next page
                        const song = nextPage.songs[0];
                        
                        // Store current state
                        const originalSongs = [...currentPage.songs];
                        
                        // Try adding the song
                        currentPage.songs.push(song);
                        this.redistributeSongs(currentPage);
                        
                        // Check if it actually fit
                        const songStillThere = currentPage.songs.find(s => s.title === song.title);
                        if (songStillThere) {
                            // Success! Remove from next page
                            const songIndex = nextPage.songs.findIndex(s => s.title === song.title);
                            if (songIndex > -1) {
                                nextPage.songs.splice(songIndex, 1);
                                this.redistributeSongs(nextPage);
                                changesMade = true;
                                console.log(`Backflow: Moved "${song.title}" from page ${startPageIndex + 2} to page ${startPageIndex + 1}`);
                            }
                        } else {
                            // Didn't fit, restore original state
                            currentPage.songs = originalSongs;
                            this.redistributeSongs(currentPage);
                        }
                    }
                }
                
                // Clean up any empty pages
                this.removeEmptyTrailingPages();
                
                return changesMade;
            }
            
            calculatePageUsage(page) {
                // Calculate approximate height usage of a page
                let totalHeight = 0;
                for (let song of page.songs) {
                    totalHeight += this.estimateSongHeight(song, page.fontSize);
                    totalHeight += (this.showTitles ? this.spacingWithTitles : this.spacingWithoutTitles);
                }
                return totalHeight;
            }
            
            handleOverflowToNextPage(currentPage, overflowSongs) {
                const pageIndex = this.pages.indexOf(currentPage);
                let nextPage;
                
                // Get or create next page
                if (pageIndex === this.pages.length - 1) {
                    // This is the last page, create a new one
                    nextPage = this.addNewPage();
                } else {
                    // Use existing next page
                    nextPage = this.pages[pageIndex + 1];
                }
                
                // Add overflow songs to the beginning of next page
                overflowSongs.forEach(song => {
                    // Reset song properties for new page
                    delete song.x;
                    delete song.y;
                    delete song.columnIndex;
                    delete song.preferredColumn;
                    delete song.bounds;
                });
                
                // Prepend overflow songs to next page (maintaining order)
                nextPage.songs = [...overflowSongs, ...nextPage.songs];
                
                // Redistribute the next page to handle the new songs
                this.redistributeSongs(nextPage);
            }
            
            handleOverflow(page) {
                // Move overflowing songs to next page
                const overflowSongs = [];
                const columnWidth = this.getColumnWidth(page.columns);
                page.columnHeights = new Array(page.columns).fill(0);
                
                const keepSongs = [];
                for (let song of page.songs) {
                    const columnIndex = this.getShortestColumnIndex(page);
                    const height = this.estimateSongHeight(song, page.fontSize);
                    
                    if (page.columnHeights[columnIndex] + height > this.USABLE_HEIGHT) {
                        overflowSongs.push(song);
                    } else {
                        song.columnIndex = columnIndex;
                        song.x = this.MARGIN_LEFT + (columnIndex * (columnWidth + this.COLUMN_GAP));
                        song.y = this.MARGIN_TOP + page.columnHeights[columnIndex];
                        song.width = columnWidth;
                        song.height = height;
                        page.columnHeights[columnIndex] += height;
                        keepSongs.push(song);
                    }
                }
                
                page.songs = keepSongs;
                
                // Add overflow songs to next page
                if (overflowSongs.length > 0) {
                    const pageIndex = this.pages.indexOf(page);
                    let nextPage;
                    
                    if (pageIndex === this.pages.length - 1) {
                        nextPage = this.addNewPage();
                    } else {
                        nextPage = this.pages[pageIndex + 1];
                    }
                    
                    overflowSongs.forEach(song => {
                        delete song.x;
                        delete song.y;
                        delete song.columnIndex;
                        this.addSongToPage(song, nextPage);
                    });
                }
            }
            
            render() {
                this.pages.forEach((page, pageIndex) => {
                    const ctx = page.ctx;
                    
                    // Clear canvas
                    ctx.fillStyle = 'white';
                    ctx.fillRect(0, 0, this.PAGE_WIDTH, this.PAGE_HEIGHT);
                    
                    // Draw background image
                    this.drawBackground(ctx);
                    
                    // Draw songs
                    ctx.fillStyle = 'black';
                    ctx.font = `${page.fontSize}px Arial`;
                    
                    // Draw preview insertion indicator if dragging
                    if (this.dragState && this.dragState.targetPage === page && this.dragState.previewPosition && this.dragState.isDragging) {
                        this.drawInsertionPreview(ctx, this.dragState.previewPosition, page.fontSize);
                    }
                    
                    page.songs.forEach((song, songIndex) => {
                        // Skip drawing the song that's currently being dragged (only if actually dragging, not just clicked)
                        if (this.dragState && this.dragState.song === song && this.dragState.isDragging) {
                            // Still store bounds for interaction, but don't draw
                            song.bounds = {
                                x: song.x,
                                y: song.y - page.fontSize,
                                width: song.width,
                                height: song.height
                            };
                            return;
                        }
                        
                        this.drawSong(ctx, song, page.fontSize);
                        
                        // Store bounds for interaction
                        song.bounds = {
                            x: song.x,
                            y: song.y - page.fontSize,
                            width: song.width,
                            height: song.height
                        };
                    });
                    
                    // Draw page number in bottom right corner if enabled
                    if (this.showPageNumbers) {
                        ctx.fillStyle = '#000000';
                        ctx.font = '14px "Times New Roman", serif';
                        ctx.textAlign = 'right';
                        const pageText = `${pageIndex + 1}`;
                        ctx.fillText(pageText, this.PAGE_WIDTH - 40, this.PAGE_HEIGHT - 40);
                        ctx.textAlign = 'left';
                    }
                });
            }
            
            drawBackground(ctx) {
                // Create background image if not already created
                if (!this.backgroundImage) {
                    this.backgroundImage = new Image();
                    this.backgroundImage.onload = () => {
                        // Re-render when image loads
                        this.render();
                    };
                    // Try to load a higher resolution version first, fallback to original
                    this.backgroundImage.src = './assets/sheetskin.png';
                    return; // Skip drawing this time, will draw when image loads
                }
                
                // Draw the background image with high quality settings
                if (this.backgroundImage.complete) {
                    // Save current settings
                    const savedSmoothing = ctx.imageSmoothingEnabled;
                    const savedQuality = ctx.imageSmoothingQuality;
                    
                    // Enable high-quality image rendering
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    
                    // Draw background to fill entire canvas
                    ctx.drawImage(this.backgroundImage, 0, 0, this.PAGE_WIDTH, this.PAGE_HEIGHT);
                    
                    // Restore settings
                    ctx.imageSmoothingEnabled = savedSmoothing;
                    ctx.imageSmoothingQuality = savedQuality;
                }
            }
            
            drawSong(ctx, song, fontSize) {
                const lineHeight = fontSize * 1.4;
                let currentY = song.y;
                
                // Set text alignment
                ctx.textAlign = this.textAlignment;
                
                // Calculate x position based on alignment
                let textX = song.x;
                if (this.textAlignment === 'center') {
                    textX = song.x + song.width / 2;
                } else if (this.textAlignment === 'right') {
                    textX = song.x + song.width;
                }
                
                // Draw title (89% of base font, 5px gap) only if showTitles is true
                if (this.showTitles) {
                    const titleFontSize = fontSize * this.titleSizeMultiplier; // 89% of base font
                    ctx.font = `bold ${titleFontSize}px Arial`;
                    ctx.fillText(song.title, textX, currentY);
                    currentY += titleFontSize * 1.4 + this.titleGap; // Title height + 5px gap
                }
                
                // Draw lyrics - ONLY break at original \n positions, never wrap lines
                ctx.font = `${fontSize}px Arial`;
                const lines = song.lyrics.split('\n');
                
                lines.forEach(line => {
                    // Draw each original line as-is, no word wrapping
                    ctx.fillText(line, textX, currentY);
                    currentY += lineHeight;
                });
                
                // Reset text alignment to left for other elements
                ctx.textAlign = 'left';
                
                // Update actual height
                song.height = currentY - song.y + this.SONG_SPACING;
            }
            
            drawInsertionPreview(ctx, previewPosition, fontSize) {
                // Draw a subtle horizontal line indicating where the song will be inserted
                const { x, y, width } = previewPosition;
                
                ctx.save();
                ctx.strokeStyle = 'rgba(242, 203, 5, 0.8)'; // Golden color with transparency
                ctx.lineWidth = 3;
                ctx.setLineDash([10, 5]); // Dashed line
                
                // Draw horizontal line
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + width, y);
                ctx.stroke();
                
                // Draw small vertical indicators at the ends
                ctx.setLineDash([]); // Solid line for indicators
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y - 5);
                ctx.lineTo(x, y + 5);
                ctx.moveTo(x + width, y - 5);
                ctx.lineTo(x + width, y + 5);
                ctx.stroke();
                
                ctx.restore();
            }
            
            calculatePreviewPosition(page, insertPosition, dropX, dropY) {
                const columnWidth = this.getColumnWidth(page.columns);
                const columnX = this.MARGIN_LEFT + insertPosition.column * (columnWidth + this.COLUMN_GAP);
                
                // Find songs in the target column (excluding dragged song)
                const songsInColumn = [];
                for (let i = 0; i < page.songs.length; i++) {
                    const song = page.songs[i];
                    if (song === this.dragState.song) continue; // Skip dragged song
                    
                    if (song.bounds) {
                        const songColumn = Math.floor((song.bounds.x - this.MARGIN_LEFT) / (columnWidth + this.COLUMN_GAP));
                        if (songColumn === insertPosition.column) {
                            songsInColumn.push({ song, index: i, y: song.bounds.y });
                        }
                    }
                }
                
                // Sort by Y position
                songsInColumn.sort((a, b) => a.y - b.y);
                
                let previewY;
                
                if (songsInColumn.length === 0) {
                    // Empty column - show at top
                    previewY = this.MARGIN_TOP;
                } else {
                    // Find where we would insert and calculate Y position
                    let insertBefore = null;
                    for (let i = 0; i < songsInColumn.length; i++) {
                        const songMiddleY = songsInColumn[i].y + (songsInColumn[i].song.bounds.height / 2);
                        if (dropY < songMiddleY) {
                            insertBefore = songsInColumn[i];
                            break;
                        }
                    }
                    
                    if (insertBefore) {
                        // Insert before this song
                        previewY = insertBefore.y - 10; // 10px above the song
                    } else {
                        // Insert after last song
                        const lastSong = songsInColumn[songsInColumn.length - 1];
                        previewY = lastSong.y + lastSong.song.bounds.height + 10; // 10px below the song
                    }
                }
                
                return {
                    x: columnX,
                    y: previewY,
                    width: columnWidth
                };
            }
            
            handleCanvasClick(page, x, y) {
                // Find clicked song
                for (let i = page.songs.length - 1; i >= 0; i--) {
                    const song = page.songs[i];
                    if (this.isPointInSong(x, y, song)) {
                        this.selectedSong = { page, song, index: i };
                        this.showRemoveButton(page, song);
                        return;
                    }
                }
                
                this.selectedSong = null;
                this.hideRemoveButtons();
            }
            
            handleCanvasHover(page, x, y) {
                const canvas = page.canvas;
                let foundSong = false;
                
                for (let song of page.songs) {
                    if (this.isPointInSong(x, y, song)) {
                        canvas.style.cursor = 'pointer';
                        foundSong = true;
                        break;
                    }
                }
                
                if (!foundSong) {
                    canvas.style.cursor = 'default';
                }
            }
            
            isPointInSong(x, y, song) {
                return song.bounds &&
                       x >= song.bounds.x &&
                       x <= song.bounds.x + song.bounds.width &&
                       y >= song.bounds.y &&
                       y <= song.bounds.y + song.bounds.height;
            }
            
            showRemoveButton(page, song) {
                this.hideRemoveButtons();
                
                const btn = document.createElement('button');
                btn.className = 'remove-btn';
                btn.innerHTML = '×';
                btn.style.display = 'flex';
                
                const canvas = page.canvas;
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / this.PAGE_WIDTH;
                const scaleY = rect.height / this.PAGE_HEIGHT;
                
                btn.style.left = (song.bounds.x + song.bounds.width - 25) * scaleX + 'px';
                btn.style.top = song.bounds.y * scaleY + 'px';
                
                btn.onclick = () => {
                    this.removeSong(page, song);
                };
                
                page.wrapper.appendChild(btn);
            }
            
            hideRemoveButtons() {
                document.querySelectorAll('.remove-btn').forEach(btn => btn.remove());
            }
            
            removeSong(page, song) {
                const index = page.songs.indexOf(song);
                if (index > -1) {
                    page.songs.splice(index, 1);
                    
                    const pageIndex = this.pages.indexOf(page);
                    
                    // Always redistribute the current page first
                    this.redistributeSongs(page);
                    
                    // Only try backflow if this page now has very few songs (2 or fewer)
                    if (page.songs.length <= 2) {
                        this.controlledBackflow(pageIndex);
                    }
                    
                    // Sync with localStorage
                    this.syncToLocalStorage();
                    
                    // Update song list to reflect changes
                    this.renderSongsList();
                    
                    this.render();
                    this.hideRemoveButtons();
                    this.updateStatus(`Removed "${song.title}"`);
                }
            }
            
            addRandomSongs(count) {
                if (this.songs.length === 0) {
                    this.updateStatus('No songs available to add');
                    return;
                }
                
                // Get available songs (not already on sheet)
                const songsOnSheet = new Set();
                this.pages.forEach(page => {
                    page.songs.forEach(song => {
                        songsOnSheet.add(song.title);
                    });
                });
                
                const availableSongs = this.songs.filter(song => !songsOnSheet.has(song.title));
                
                if (availableSongs.length === 0) {
                    this.updateStatus('All songs are already on the sheet');
                    return;
                }
                
                // Randomly select songs
                const songsToAdd = [];
                const shuffled = [...availableSongs].sort(() => 0.5 - Math.random());
                
                for (let i = 0; i < Math.min(count, shuffled.length); i++) {
                    songsToAdd.push(shuffled[i]);
                }
                
                // Add songs to sheet
                songsToAdd.forEach(song => {
                    this.addSongToSheet(song);
                });
                
                this.updateStatus(`Added ${songsToAdd.length} random songs to the sheet`);
            }
            
            clearAll() {
                if (!confirm('Clear all songs from the sheet?')) return;
                
                // Clear all pages except first
                while (this.pages.length > 1) {
