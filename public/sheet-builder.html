                    const lastPage = this.pages.pop();
                    lastPage.wrapper.remove();
                }
                
                // Clear first page
                this.pages[0].songs = [];
                this.pages[0].columns = 1;
                this.pages[0].fontSize = 18;
                this.pages[0].columnHeights = [0];
                
                // Clear localStorage
                localStorage.removeItem("sheetSongs");
                
                // Update song list to reflect changes
                this.renderSongsList();
                
                this.render();
                this.updateStatus('Sheet cleared');
            }
            
            async exportPDF() {
                this.updateStatus('Generating PDF...');
                
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: 'portrait',
                    unit: 'pt',
                    format: 'letter'
                });
                
                for (let i = 0; i < this.pages.length; i++) {
                    if (i > 0) pdf.addPage();
                    
                    const canvas = this.pages[i].canvas;
                    const imgData = canvas.toDataURL('image/png');
                    pdf.addImage(imgData, 'PNG', 0, 0, this.PAGE_WIDTH, this.PAGE_HEIGHT);
                }
                
                pdf.save('song-sheet.pdf');
                this.updateStatus('PDF exported successfully');
            }
            
            updateStatus(message) {
                document.getElementById('status').textContent = message;
                setTimeout(() => {
                    document.getElementById('status').textContent = 'Drag songs to the sheet or double-click to add';
                }, 3000);
            }
            
            toggleTitles() {
                this.showTitles = !this.showTitles;
                const btn = document.getElementById('toggleTitlesBtn');
                btn.textContent = this.showTitles ? 'Hide Titles' : 'Show Titles';
                
                // Re-optimize all pages with potential consolidation
                this.reoptimizeAllPages();
                
                this.render();
                this.updateStatus(this.showTitles ? 'Titles are now visible' : 'Titles are now hidden');
            }
            
            togglePageNumbers() {
                this.showPageNumbers = !this.showPageNumbers;
                const btn = document.getElementById('togglePageNumbersBtn');
                btn.textContent = this.showPageNumbers ? 'Hide Page Numbers' : 'Show Page Numbers';
                
                // Re-render to update page number visibility
                this.render();
                this.updateStatus(this.showPageNumbers ? 'Page numbers are now visible' : 'Page numbers are now hidden');
            }
            
            setAlignment(alignment) {
                this.textAlignment = alignment;
                
                // Update button states
                document.querySelectorAll('.alignment-controls button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.getElementById(`align${alignment.charAt(0).toUpperCase() + alignment.slice(1)}Btn`).classList.add('active');
                
                // Re-render with new alignment
                this.render();
                this.updateStatus(`Text alignment set to ${alignment}`);
            }
            
            setMaxColumns(maxCols) {
                this.maxColumns = maxCols;
                
                // Update button states
                document.querySelectorAll('.column-controls button').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.getElementById(`col${maxCols}Btn`).classList.add('active');
                
                // Re-optimize all pages with potential consolidation
                this.reoptimizeAllPages();
                
                this.render();
                this.updateStatus(`Maximum columns set to ${maxCols}`);
            }
            
            reoptimizeAllPages() {
                // Collect all songs from all pages
                const allSongs = [];
                this.pages.forEach(page => {
                    allSongs.push(...page.songs);
                });
                
                // Clear all pages except the first
                while (this.pages.length > 1) {
                    const lastPage = this.pages.pop();
                    lastPage.wrapper.remove();
                }
                
                // Clear the first page
                this.pages[0].songs = [];
                this.pages[0].columns = 1;
                this.pages[0].fontSize = 18;
                this.pages[0].columnHeights = [0];
                
                // Re-add all songs, letting the optimization system decide the best layout
                allSongs.forEach(song => {
                    // Clean song positioning data
                    delete song.x;
                    delete song.y;
                    delete song.columnIndex;
                    delete song.bounds;
                    
                    this.addSongToSheet(song);
                });
                
                console.log(`Reoptimized: ${allSongs.length} songs across ${this.pages.length} pages`);
            }
            
            setupEventListeners() {
                // Search functionality
                document.getElementById('searchBox').addEventListener('input', (e) => {
                    const search = e.target.value.toLowerCase();
                    document.querySelectorAll('.song-item').forEach(item => {
                        const title = item.querySelector('.song-title').textContent.toLowerCase();
                        const artist = item.querySelector('.song-artist').textContent.toLowerCase();
                        item.style.display = (title.includes(search) || artist.includes(search)) ? 'block' : 'none';
                    });
                });
                
                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Delete' && this.selectedSong) {
                        this.removeSong(this.selectedSong.page, this.selectedSong.song);
                    }
                    if (e.ctrlKey && e.key === 's') {
                        e.preventDefault();
                        this.exportPDF();
                    }
                });
            }
        }
        
        // Initialize
        const sheetBuilder = new SheetBuilder();
        window.sheetBuilder = sheetBuilder;
    </script>
</body>
