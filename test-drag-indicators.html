<!DOCTYPE html>
<html>
<head>
    <title>Test Drag Indicators</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Drag Indicator System Test</h1>
    
    <div id="status">
        <div class="status">Testing drag indicator implementation...</div>
    </div>
    
    <iframe src="/public/sheet-builder.html" width="100%" height="600" frameborder="1"></iframe>
    
    <script>
        let testResults = [];
        
        function addStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            const newStatus = document.createElement('div');
            newStatus.className = `status ${isError ? 'error' : 'success'}`;
            newStatus.textContent = message;
            statusDiv.appendChild(newStatus);
        }
        
        // Test if the page loads without errors
        window.addEventListener('load', () => {
            setTimeout(() => {
                const iframe = document.querySelector('iframe');
                try {
                    // Check if the iframe loaded successfully
                    if (iframe.contentWindow) {
                        addStatus('✓ Sheet builder page loaded successfully');
                        
                        // Check if SheetBuilder class exists
                        if (iframe.contentWindow.sheetBuilder) {
                            addStatus('✓ SheetBuilder instance found');
                            
                            // Check if drag methods exist
                            const sb = iframe.contentWindow.sheetBuilder;
                            const methods = [
                                'createDragPreview',
                                'updateDragPreview', 
                                'removeDragPreview',
                                'createDropZones',
                                'findNearestRailPosition',
                                'repositionSongToRail',
                                'addSongToRail'
                            ];
                            
                            methods.forEach(method => {
                                if (typeof sb[method] === 'function') {
                                    addStatus(`✓ Method ${method} exists`);
                                } else {
                                    addStatus(`✗ Method ${method} missing`, true);
                                }
                            });
                            
                            // Check if drag state variables exist
                            const variables = ['dragPreview', 'isDragging', 'dropZones'];
                            variables.forEach(variable => {
                                if (variable in sb) {
                                    addStatus(`✓ Variable ${variable} exists`);
                                } else {
                                    addStatus(`✗ Variable ${variable} missing`, true);
                                }
                            });
                            
                        } else {
                            addStatus('✗ SheetBuilder instance not found', true);
                        }
                    } else {
                        addStatus('✗ Could not access iframe content', true);
                    }
                } catch (error) {
                    addStatus('✗ Error accessing iframe: ' + error.message, true);
                }
            }, 2000);
        });
    </script>
</body>
</html>
